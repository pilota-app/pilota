# Revisión automática de cada cambio (y de cada pull request): si algo falla, se ve antes de que llegue a alguien.
# - revisar: bash pruebas/correr.sh (contrato del puente, Python, interfaz con Playwright, privacidad) con capturas para mirar.
# - app: la app nativa (Rust, pieza «host-tauri») en cada sistema de app.json: compila con Cargo.lock, pasa sus pruebas y clippy
#   sin avisos; en Linux además se abre de verdad con una pantalla virtual (la interfaz manda «listo» por el puente).
# Actions fijadas por SHA con su versión en un comentario (Dependabot las sube), permisos mínimos, sin credenciales guardadas y
# ninguna expresión de GitHub dentro de `run:`. ubuntu-24.04 y no -latest: Playwright todavía no trae Chromium para 26.04.
# Generado por la pieza «github» de Pieza desde app.json: si lo cambias, desde ahí es de la app y Pieza ya no lo toca.
name: Revisar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: revisar-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Playwright (la interfaz en un navegador de verdad)
        run: |
          npm i --no-save --ignore-scripts --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Pruebas
        run: |
          mkdir -p capturas
          # La app nativa se prueba en el job «app», con lo que Tauri necesita en cada sistema.
          SIN_RUST=1 CAPTURAS="$PWD/capturas" bash pruebas/correr.sh
      - name: Capturas para revisar a ojo
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: capturas, path: capturas, retention-days: 14, if-no-files-found: ignore }

  app:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults: { run: { shell: bash, working-directory: escritorio } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Lo que Tauri necesita en Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb
      - name: Pruebas y clippy (exactamente lo de Cargo.lock)
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: La app abierta en Linux (pantalla virtual)
        if: runner.os == 'Linux'
        run: bash pruebas/arranque.sh
